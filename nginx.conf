server {
    listen 80;
    
    # Set the root directory where the built files are located
    root /usr/share/nginx/html;
    
    # Handle routing for Single Page Applications (SPA)
    # If a file isn't found, fallback to index.html so React Router can handle it
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # Optional: Basic error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
